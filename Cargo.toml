[package]
name = "evogym-labs"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "2D soft-voxel robot evolution simulator with hand-rolled spring physics, a genetic algorithm, a software rasterizer and a headless video pipeline."
license = "Apache-2.0"
repository = "https://github.com/llaa33219/evogym-labs"
homepage = "https://github.com/llaa33219/evogym-labs"
readme = "README.md"
keywords = ["physics", "simulation", "robotics", "genetic-algorithms", "soft-body"]
categories = ["simulation", "science", "gui", "command-line-utilities", "visualization"]
exclude = [
    # `evogym` is a stray 10.5 MB PostScript artifact in the repo root; it is
    # untracked and gitignored, but without this it would still be packaged.
    "evogym",
    # CI config is useful in the repo, not to consumers of the crate.
    "/.github",
]

[lib]
name = "evogym_labs"
path = "src/lib.rs"

[[bin]]
name = "evogym-labs"
path = "src/main.rs"

[features]
default = ["gui"]
# Set `default-features = false` and disable the `gui` feature to build
# a pure headless binary that does not depend on eframe/winit/wgpu.
gui = ["dep:eframe", "dep:egui"]
# Integration tests live under tests/ and only compile when this feature is on
# (they shell out to ffmpeg / ffprobe and take a few seconds).
integration = []

[dependencies]
ab_glyph        = { version = "0.2.32", default-features = false, features = ["std"] }
clap            = { version = "4.5", features = ["derive"] }
rayon           = "1.10"
rand            = "0.9"
thiserror       = "1.0"

# GUI only — never touched by `--headless`.
eframe = { version = "0.32", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui   = { version = "0.32", optional = true }

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
